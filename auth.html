
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود و ثبت‌نام | درسک</title>

    <link rel="icon" type="image/png" href="images/darsak-logo-dark.png">
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            background: #f1f5f9;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            padding: 36px;
            border-radius: 22px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-brand img {
            width: 76px;
            height: 76px;
            object-fit: contain;
        }

        .auth-brand h1 {
            color: #1d4ed8;
            margin: 8px 0;
            font-size: 30px;
        }

        .auth-brand p {
            color: #64748b;
            margin: 0;
            line-height: 1.9;
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 5px;
            background: #f1f5f9;
            border-radius: 12px;
            margin-bottom: 26px;
        }

        .auth-tab {
            padding: 12px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font: inherit;
            background: transparent;
            color: #475569;
            transition: 0.2s;
        }

        .auth-tab.active {
            background: #1d4ed8;
            color: white;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.2);
        }

        .auth-form h2 {
            font-size: 22px;
            color: #0f172a;
            margin: 0 0 8px;
        }

        .auth-description {
            color: #64748b;
            font-size: 14px;
            line-height: 1.9;
            margin: 0 0 22px;
        }

        .auth-field {
            margin-bottom: 18px;
        }

        .auth-field label {
            display: block;
            color: #334155;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .auth-field input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font: inherit;
            outline: none;
            background: white;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .auth-field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .auth-submit {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 14px;
            margin-top: 5px;
            background: #1d4ed8;
            color: white;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .auth-submit:hover {
            background: #1e40af;
            transform: translateY(-1px);
        }

        .auth-notice {
            display: none;
            margin-top: 16px;
            padding: 12px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 10px;
            color: #92400e;
            font-size: 13px;
            line-height: 1.9;
        }

        .auth-back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #1d4ed8;
            text-decoration: none;
            font-size: 14px;
        }


        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 12px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #e2e8f0;
        }
        .google-auth-button {
            width: 100%;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #fff;
            color: #1e293b;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
            transition: border-color .2s, box-shadow .2s, transform .2s, background .2s;
        }
        .google-auth-button:hover {
            border-color: #94a3b8;
            background: #f8fafc;
            box-shadow: 0 5px 16px rgba(15,23,42,.07);
            transform: translateY(-1px);
        }
        .google-auth-button:focus-visible {
            outline: 3px solid rgba(37,99,235,.2);
            outline-offset: 2px;
        }
        .google-auth-button:disabled {
            opacity: .65;
            cursor: wait;
            transform: none;
        }
        .google-auth-button svg { width: 20px; height: 20px; flex: 0 0 20px; }
        .auth-provider-note {
            margin: 9px 0 0;
            color: #94a3b8;
            text-align: center;
            font-size: 11px;
            line-height: 1.8;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-brand">
                <img
    id="darsak-logo"
    src="images/darsak-logo.png"
    alt="لوگوی درسک"
>
                <h1>درسک</h1>
                <p>یادگیری آسان، آینده روشن‌تر</p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active"
                    data-form="login">ورود</button>

                <button type="button" class="auth-tab"
                    data-form="register">ثبت‌نام</button>
            </div>


            <div class="auth-divider" aria-hidden="true">یا با حساب گوگل ادامه بده</div>
            <button type="button" class="google-auth-button" id="googleAuthButton">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.91c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.39 37.98 46.98 31.8 46.98 24.55z"/>
                    <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>ادامه با گوگل</span>
            </button>
            <p class="auth-provider-note">ورود امن از طریق حساب Google و سرویس احراز هویت درسک</p>

            <form class="auth-form" id="loginForm">
                <h2>خوش برگشتی! 👋</h2>
                <p class="auth-description">
                    وارد حساب کاربری خودت در درسک شو.
                </p>

                <div class="auth-field">
                    <label for="loginEmail">ایمیل</label>
                    <input type="email" id="loginEmail"
                        placeholder="example@email.com"
                        autocomplete="email" required>
                </div>

                <div class="auth-field">
                    <label for="loginPassword">رمز عبور</label>
                    <input type="password" id="loginPassword"
                        placeholder="رمز عبورت رو وارد کن"
                        autocomplete="current-password"
                        required minlength="8">
                </div>

                <button class="auth-submit" type="submit">
                    ورود به حساب
                </button>
            </form>

            <form class="auth-form" id="registerForm" hidden>
                <h2>به خانواده درسک خوش اومدی! 🎓</h2>
                <p class="auth-description">
                    حساب خودت رو بساز و مسیر یادگیری رو شروع کن.
                </p>

                <div class="auth-field">
                    <label for="registerName">نام</label>
                    <input type="text" id="registerName"
                        placeholder="نام خودت رو وارد کن"
                        autocomplete="name" required>
                </div>

                <div class="auth-field">
                    <label for="registerEmail">ایمیل</label>
                    <input type="email" id="registerEmail"
                        placeholder="example@email.com"
                        autocomplete="email" required>
                </div>

                <div class="auth-field">
                    <label for="registerPassword">رمز عبور</label>
                    <input type="password" id="registerPassword"
                        placeholder="حداقل ۸ کاراکتر"
                        autocomplete="new-password"
                        minlength="8" required>
                </div>

                <div class="auth-field">
                    <label for="confirmPassword">تکرار رمز عبور</label>
                    <input type="password" id="confirmPassword"
                        placeholder="رمز عبور رو دوباره وارد کن"
                        autocomplete="new-password"
                        minlength="8" required>
                </div>

                <button class="auth-submit" type="submit">
                    ساخت حساب کاربری
                </button>
            </form>

            <div class="auth-notice" id="authNotice" role="status"></div>

            <a href="index.html" class="auth-back">
                ← بازگشت به صفحه اصلی درسک
            </a>

        </section>
    </main>

    
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<script>
        
const tabs = document.querySelectorAll(".auth-tab");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const notice = document.getElementById("authNotice");

function showNotice(message) {
    notice.textContent = message;
    notice.style.display = "block";
}

tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
        const showRegister = tab.dataset.form === "register";

        tabs.forEach(function (item) {
            item.classList.toggle("active", item === tab);
        });

        loginForm.hidden = showRegister;
        registerForm.hidden = !showRegister;
        notice.style.display = "none";
        notice.textContent = "";
    });
});


const googleAuthButton = document.getElementById("googleAuthButton");
googleAuthButton.addEventListener("click", async function () {
    const originalText = googleAuthButton.querySelector("span").textContent;
    googleAuthButton.disabled = true;
    googleAuthButton.querySelector("span").textContent = "در حال اتصال به گوگل...";
    notice.style.display = "none";

    try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: {
                redirectTo: window.location.origin + "/index.html",
                queryParams: { prompt: "select_account" }
            }
        });

        if (error) {
            showNotice("ورود با گوگل انجام نشد. تنظیمات Google در سرویس احراز هویت درسک را بررسی کن.");
            googleAuthButton.disabled = false;
            googleAuthButton.querySelector("span").textContent = originalText;
        }
    } catch (error) {
        showNotice("ارتباط با گوگل برقرار نشد. لطفاً دوباره تلاش کن.");
        googleAuthButton.disabled = false;
        googleAuthButton.querySelector("span").textContent = originalText;
    }
});


// ثبت‌نام واقعی با Supabase
registerForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const name = document.getElementById("registerName").value.trim();
    const email = document.getElementById("registerEmail").value
        .trim()
        .toLowerCase();
    const password = document.getElementById("registerPassword").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (!name || !email || !password) {
        showNotice("لطفاً همه فیلدها را کامل کن.");
        return;
    }

    if (password.length < 8) {
        showNotice("رمز عبور باید حداقل ۸ کاراکتر داشته باشد.");
        return;
    }

    if (password !== confirmPassword) {
        showNotice("رمز عبور و تکرار آن یکسان نیستند.");
        return;
    }

    const submitButton = registerForm.querySelector(
        'button[type="submit"]'
    );

    submitButton.disabled = true;
    submitButton.textContent = "در حال ساخت حساب...";

    try {
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: name
                },
                emailRedirectTo: window.location.origin + "/auth.html"
            }
        });

        if (error) {
            showNotice("ثبت‌نام انجام نشد: " + error.message);
            return;
        }

        if (data.session) {
            showNotice("حساب ساخته شد! در حال انتقال...");
            window.location.href = "index.html";
        } else {
            showNotice(
                "ثبت‌نام انجام شد! ایمیلت را بررسی کن و روی لینک تأیید کلیک کن."
            );
        }
    } catch (error) {
        showNotice("ارتباط برقرار نشد. اینترنت و تنظیمات اتصال را بررسی کن.");
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "ساخت حساب کاربری";
    }
});

// ورود واقعی با Supabase
loginForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value
        .trim()
        .toLowerCase();
    const password = document.getElementById("loginPassword").value;

    const submitButton = loginForm.querySelector(
        'button[type="submit"]'
    );

    submitButton.disabled = true;
    submitButton.textContent = "در حال ورود...";

    try {
        const { error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            showNotice(
                "ورود انجام نشد. ایمیل و رمز عبور را بررسی کن و اگر ایمیلت تأیید نشده، ابتدا آن را تأیید کن."
            );
            return;
        }

        window.location.href = "index.html";
    } catch (error) {
        showNotice("ارتباط برقرار نشد. دوباره امتحان کن.");
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "ورود به حساب";
    }
});

    </script>
    <script src="script.js"></script>

</body>
</html>
