
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تایمر مطالعه | درسک</title>
    <link rel="icon" type="image/png" href="../images/darsak-logo-dark.png">
    <link rel="stylesheet" href="../style.css">

    <style>
        .timer-container {
            max-width: 480px;
            margin: 55px auto;
            padding: 30px;
            border-radius: 24px;
            background: var(--card-bg, #fff);
            color: inherit;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
            text-align: center;
        }

        .timer-container h1 {
            margin-bottom: 10px;
        }

        .timer-subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .timer-modes {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 30px;
        }

        .timer-modes button {
            border: none;
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            background: #e2e8f0;
            color: #334155;
            font-weight: bold;
        }

        .timer-modes button.active {
            background: #2563eb;
            color: white;
        }

        .timer-circle {
            width: 240px;
            height: 240px;
            margin: 0 auto 25px;
            border: 9px solid #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .timer-time {
            font-size: 55px;
            font-weight: bold;
            direction: ltr;
            font-variant-numeric: tabular-nums;
        }

        .timer-status {
            color: #64748b;
            margin-top: 5px;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .timer-controls button {
            border: none;
            padding: 13px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .timer-start {
            background: #2563eb;
            color: white;
        }

        .timer-reset {
            background: #e2e8f0;
            color: #334155;
        }

        .timer-sessions {
            margin-top: 25px;
            color: #64748b;
        }

        .timer-back {
            display: block;
            margin-top: 25px;
            color: inherit;
            text-decoration: none;
        }

        html[data-theme="dark"] .timer-container {
            background: #1e293b;
            border: 1px solid #334155;
        }

        html[data-theme="dark"] .timer-modes button,
        html[data-theme="dark"] .timer-reset {
            background: #334155;
            color: #f1f5f9;
        }

        html[data-theme="dark"] .timer-modes button.active {
            background: #2563eb;
            color: white;
        }

        html[data-theme="dark"] .timer-subtitle,
        html[data-theme="dark"] .timer-status,
        html[data-theme="dark"] .timer-sessions {
            color: #cbd5e1;
        }
    </style>
</head>

<body>

<header class="site-header">
    <a href="../index.html" class="brand">
        <img
    id="darsak-logo"
    src="../images/darsak-logo.png"
    alt="لوگوی درسک"
>
        <span>درسک</span>
    </a>

    <nav>
        <a href="../index.html">صفحه اصلی</a>
        <a href="../tools.html">ابزارها</a>
        <a href="../auth.html" class="login-button login-nav-btn">
            ورود و ثبت‌نام
        </a>
    </nav>
</header>

<main>
    <section class="timer-container">

        <h1>⏱️ تایمر مطالعه درسک</h1>
        <p class="timer-subtitle">با تمرکز بیشتر درس بخون!</p>

        <div class="timer-modes">
            <button class="active" onclick="changeMode('study', this)">
                مطالعه
            </button>

            <button onclick="changeMode('short', this)">
                استراحت کوتاه
            </button>

            <button onclick="changeMode('long', this)">
                استراحت طولانی
            </button>
        </div>

        <div class="timer-circle">
            <div class="timer-time" id="timer">25:00</div>
            <div class="timer-status" id="status">آماده شروع!</div>
        </div>

        <div class="timer-controls">
            <button class="timer-start" id="startButton" onclick="toggleTimer()">
                شروع
            </button>

            <button class="timer-reset" onclick="resetTimer()">
                بازنشانی
            </button>
        </div>

        <p class="timer-sessions">
            جلسات مطالعه تکمیل‌شده: <strong id="sessions">0</strong>
        </p>

        <a href="../tools.html" class="timer-back">
            ← بازگشت به ابزارها
        </a>

    </section>
</main>

<script>
    const durations = {
        study: 25 * 60,
        short: 5 * 60,
        long: 15 * 60
    };

    let currentMode = "study";
    let remaining = durations.study;
    let interval = null;
    let sessions = 0;

    const timerDisplay = document.getElementById("timer");
    const statusDisplay = document.getElementById("status");
    const startButton = document.getElementById("startButton");

    function updateDisplay() {
        const minutes = Math.floor(remaining / 60);
        const seconds = remaining % 60;

        timerDisplay.textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");
    }

    function changeMode(mode, button) {
        stopTimer();

        currentMode = mode;
        remaining = durations[mode];

        document.querySelectorAll(".timer-modes button")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        statusDisplay.textContent = "آماده شروع!";
        updateDisplay();
    }

    function toggleTimer() {
        if (interval) {
            stopTimer();
            statusDisplay.textContent = "متوقف شده";
            return;
        }

        startButton.textContent = "توقف";
        statusDisplay.textContent = "در حال اجرا...";

        interval = setInterval(() => {
            remaining--;
            updateDisplay();

            if (remaining <= 0) {
                stopTimer();

                if (currentMode === "study") {
                    sessions++;
                    document.getElementById("sessions").textContent = sessions;
                }

                statusDisplay.textContent = "زمان تمام شد! 🎉";
                startButton.textContent = "شروع";

                alert("زمان به پایان رسید! آفرین! 🎉");
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(interval);
        interval = null;
        startButton.textContent = "شروع";
    }

    function resetTimer() {
        stopTimer();
        remaining = durations[currentMode];
        statusDisplay.textContent = "آماده شروع!";
        updateDisplay();
    }

    updateDisplay();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="../script.js"></script>

</body>
</html>
