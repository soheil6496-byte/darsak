<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خریدهای من | درسک</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="images/darsak-logo-dark.png">
    <link rel="stylesheet" href="style.css">

    <style>
        .purchases-page { max-width: 1000px; margin: 45px auto; padding: 20px; }
        .purchases-heading { margin-bottom: 30px; text-align: center; }
        .purchases-heading h1 { font-size: 30px; color: var(--primary); }
        .purchases-heading p { color: #777; line-height: 1.9; }

        .purchases-card {
            padding: 28px; border: 1px solid #e2e8f0; border-radius: 18px;
            background: #fff; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        }

        .purchases-empty { padding: 35px 15px; text-align: center; }
        .purchases-empty .empty-icon { font-size: 55px; margin-bottom: 15px; }
        .purchases-empty h2 { font-size: 21px; }
        .purchases-empty p { color: #777; line-height: 2; }

        .purchases-button {
            display: inline-block; margin-top: 15px; padding: 12px 22px; border: none;
            border-radius: 10px; background: #1769d2; color: #fff; text-decoration: none;
            font: inherit; font-weight: bold; cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .purchases-button:hover { background: #1055ad; transform: translateY(-2px); }
        .purchases-button:disabled { opacity: .6; cursor: wait; transform: none; }

        .purchase-item {
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; flex-wrap: wrap; padding: 18px 0; border-bottom: 1px solid #e8edf5;
        }
        .purchase-item:last-child { border-bottom: none; }
        .purchase-info h3 { font-size: 17px; margin-bottom: 4px; }
        .purchase-info p { color: #777; font-size: 13px; }
        .purchase-item .purchases-button { margin-top: 0; padding: 10px 18px; }

        .payment-banner { display: none; margin-bottom: 20px; padding: 14px; border-radius: 12px; line-height: 1.9; }
        .payment-banner.show { display: block; }
        .payment-banner.success { background: #e5f7ec; color: #247a45; }
        .payment-banner.failed { background: #fff0f0; color: #a32121; }
        .payment-banner.pending { background: #fffbeb; color: #92400e; }

        .purchases-back { display: inline-block; margin-top: 25px; color: #1769d2; text-decoration: none; }

        @media (max-width: 600px) {
            .purchases-page { margin: 20px auto; padding: 14px; }
            .purchases-heading h1 { font-size: 25px; }
            .purchases-card { padding: 20px; }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="brand">
            <img src="images/darsak-logo.png" alt="لوگوی درسک">
            <span>درسک</span>
        </a>
        <nav class="main-nav">
            <a href="index.html">خانه</a>
            <a href="books.html">کتاب‌ها</a>
            <a href="index.html#resources">جزوه‌ها و منابع</a>
        </nav>
        <a href="auth.html" class="login-button">ورود / ثبت‌نام</a>
    </header>

    <main class="purchases-page">

        <section class="purchases-heading">
            <h1>🛍️ خریدهای من</h1>
            <p>اینجا می‌تونی منابع خریداری‌شده‌ات رو ببینی و دانلود کنی.</p>
        </section>

        <div class="payment-banner" id="paymentBanner" role="status"></div>

        <section class="purchases-card" id="purchasesCard">
            <div class="purchases-empty">
                <div class="empty-icon">⏳</div>
                <h2>در حال بارگذاری...</h2>
            </div>
        </section>

        <a href="index.html" class="purchases-back">← بازگشت به صفحه اصلی</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>

    <script>
const PRODUCT_NAMES = {
    "grade10-pdf": "فایل آموزشی پایه دهم",
    "full-notes-bundle": "بسته جزوه‌های کامل برای هر درس"
};

const card = document.getElementById("purchasesCard");

function emptyState(icon, title, text, linkHref, linkText) {
    card.innerHTML = "";
    const box = document.createElement("div");
    box.className = "purchases-empty";

    const i = document.createElement("div");
    i.className = "empty-icon";
    i.textContent = icon;

    const h = document.createElement("h2");
    h.textContent = title;

    const p = document.createElement("p");
    p.textContent = text;

    const a = document.createElement("a");
    a.className = "purchases-button";
    a.href = linkHref;
    a.textContent = linkText;

    box.append(i, h, p, a);
    card.append(box);
}

function showPaymentBanner() {
    const status = new URLSearchParams(location.search).get("payment");
    const messages = {
        success: ["success", "پرداخت با موفقیت انجام شد ✅ می‌تونی فایلت رو همین‌جا دانلود کنی."],
        failed: ["failed", "پرداخت انجام نشد یا لغو شد. اگر مبلغی از حسابت کم شده، معمولاً تا ۷۲ ساعت برمی‌گرده."],
        pending: ["pending", "وضعیت پرداخت هنوز مشخص نیست. چند دقیقه بعد این صفحه را دوباره باز کن."]
    };
    const info = messages[status];
    if (!info) return;

    const banner = document.getElementById("paymentBanner");
    banner.textContent = info[1];
    banner.className = "payment-banner show " + info[0];
}

async function download(orderId, button) {
    button.disabled = true;
    const oldText = button.textContent;
    button.textContent = "در حال آماده‌سازی...";

    try {
        const { data, error } = await supabaseClient.functions.invoke(
            "get-download",
            { body: { order_id: orderId } }
        );
        if (error || !data || !data.url) throw error || new Error("no url");
        window.location.href = data.url;
    } catch (e) {
        console.error(e);
        alert("دانلود انجام نشد. دوباره امتحان کن.");
    } finally {
        button.disabled = false;
        button.textContent = oldText;
    }
}

async function loadPurchases() {
    showPaymentBanner();

    const { data: userData } = await supabaseClient.auth.getUser();

    if (!userData || !userData.user) {
        emptyState("🔒", "ابتدا وارد شو",
            "برای دیدن خریدهایت باید وارد حساب کاربری‌ات باشی.",
            "auth.html", "ورود / ثبت‌نام");
        return;
    }

    const { data: orders, error } = await supabaseClient
        .from("orders")
        .select("id, product_id, amount, paid_at")
        .eq("status", "paid")
        .order("paid_at", { ascending: false });

    if (error) {
        console.error(error);
        emptyState("⚠️", "خطا در دریافت خریدها",
            "لطفاً چند لحظه بعد دوباره امتحان کن.", "my-purchases.html", "تلاش دوباره");
        return;
    }

    if (!orders || orders.length === 0) {
        emptyState("📚", "هنوز خریدی ثبت نشده!",
            "وقتی خریدی انجام بدی، محصولاتت در این قسمت نمایش داده می‌شن.",
            "index.html#resources", "مشاهده منابع");
        return;
    }

    card.innerHTML = "";

    orders.forEach(function (order) {
        const item = document.createElement("div");
        item.className = "purchase-item";

        const info = document.createElement("div");
        info.className = "purchase-info";

        const title = document.createElement("h3");
        title.textContent = PRODUCT_NAMES[order.product_id] || order.product_id;

        const meta = document.createElement("p");
        const date = order.paid_at
            ? new Date(order.paid_at).toLocaleDateString("fa-IR")
            : "";
        const price = order.amount != null
            ? order.amount.toLocaleString("fa-IR") + " تومان"
            : "";
        meta.textContent = [date, price].filter(Boolean).join(" • ");

        info.append(title, meta);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "purchases-button";
        button.textContent = "⬇️ دانلود";
        button.addEventListener("click", function () {
            download(order.id, button);
        });

        item.append(info, button);
        card.append(item);
    });
}

loadPurchases();
    </script>

</body>
</html>
